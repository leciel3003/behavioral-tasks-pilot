<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>행동과제</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --ink: #172326;
      --muted: #667276;
      --line: #d6ddda;
      --button-top: #f0f2f2;
      --button-bottom: #d9ddde;
      --button-shadow: #aeb5b7;
      font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
    }
    button, input { font: inherit; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(35, 111, 107, .25);
      outline-offset: 2px;
    }

    .app {
      width: min(720px, calc(100% - 32px));
      display: grid;
      justify-items: center;
      gap: 28px;
      padding: 28px 0;
      text-align: center;
    }
    header { display: grid; gap: 10px; }
    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.12;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }
    .identity {
      width: min(340px, 100%);
      display: grid;
      gap: 10px;
      justify-items: stretch;
    }
    label {
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 58px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      text-align: center;
      font-size: 20px;
    }
    .button-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    .task-button {
      min-height: 154px;
      padding: 18px 14px;
      border: 1px solid #b8bec0;
      border-radius: 10px;
      background: linear-gradient(180deg, var(--button-top) 0%, var(--button-bottom) 100%);
      color: #303638;
      font-weight: 800;
      line-height: 1.3;
      text-align: center;
      display: grid;
      align-content: center;
      justify-items: center;
      box-shadow: 0 7px 0 var(--button-shadow), 0 12px 18px rgba(45, 52, 54, .16);
      transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
    }
    .task-button strong {
      display: block;
      font-size: clamp(22px, 4vw, 30px);
    }
    .task-button small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    .task-button:hover {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #f7f8f8 0%, #e0e4e5 100%);
      box-shadow: 0 9px 0 var(--button-shadow), 0 15px 22px rgba(45, 52, 54, .2);
    }
    .task-button:active {
      transform: translateY(6px);
      box-shadow: 0 1px 0 var(--button-shadow), 0 5px 9px rgba(45, 52, 54, .12);
    }
    .status {
      min-height: 24px;
      margin: 0;
      color: #9b3f2f;
      font-size: 15px;
      line-height: 1.45;
    }
    .completion-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #ffffff;
      color: #111111;
      font-size: clamp(25px, 4.8vw, 42px);
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      white-space: pre-line;
    }
    .completion-screen .task-button {
      width: min(380px, 84vw);
      min-height: 140px;
      margin-top: 28px;
      padding: 18px 14px;
      font-size: clamp(24px, 6vw, 32px);
    }

    @media (max-width: 600px) {
      body {
        align-items: start;
      }

      .app {
        width: calc(100% - 24px);
        min-height: 100svh;
        align-content: center;
        gap: 18px;
        padding: max(18px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
      }

      h1 { font-size: 34px; }
      .subtitle { font-size: 15px; line-height: 1.42; }
      .identity { width: min(320px, 100%); gap: 8px; }
      input { min-height: 54px; font-size: 18px; }
      .button-grid { grid-template-columns: 1fr; gap: 16px; }
      .task-button { min-height: 112px; padding: 16px 12px; }
      .task-button strong { font-size: 24px; }
    }

    @media (max-width: 360px) {
      .app { gap: 15px; }
      h1 { font-size: 30px; }
      .subtitle { font-size: 14px; }
      .task-button { min-height: 98px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>행동과제</h1>
      <p class="subtitle">세션 번호를 입력한 뒤 과제 순서를 선택해 주세요.</p>
    </header>

    <section class="identity" aria-labelledby="session-label">
      <label id="session-label" for="participantId">세션 번호</label>
      <input id="participantId" type="text" autocomplete="off" inputmode="text" placeholder="세션 번호 입력">
    </section>

    <section class="button-grid" aria-label="통합 과제 순서 선택">
      <button class="task-button" type="button" data-entry="combined_paint_first" data-tasks="paint,star-picking-task">
        <strong>물감 모으기<br>→ 별 따기</strong>
      </button>
      <button class="task-button" type="button" data-entry="combined_coin_first" data-tasks="star-picking-task,paint">
        <strong>별 따기<br>→ 물감 모으기</strong>
      </button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbwPbSnnB-OQPT15lBwMk7f9yaiZexMsY4HV2TrW-gyJ7ylFNIxIrf19rSEpFvx0iJfOww/exec";
    const participantId = document.getElementById("participantId");
    const status = document.getElementById("status");

    function makeId(prefix) {
      if (crypto && typeof crypto.randomUUID === "function") return `${prefix}-${crypto.randomUUID()}`;
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function begin(entryCondition, tasks) {
      const id = participantId.value.trim();
      if (!id) {
        status.textContent = "세션 번호를 입력해 주세요.";
        participantId.focus();
        return;
      }

      const workflow = {
        participant_id: id,
        entry_condition: entryCondition,
        workflow_session_id: makeId("workflow"),
        sheet_url: SHEET_URL,
        auto_upload: true,
        tasks,
        current_index: 0,
        started_at: new Date().toISOString()
      };
      sessionStorage.setItem("behavioralTaskWorkflow", JSON.stringify(workflow));
      localStorage.setItem("behavioralTaskParticipantId", id);
      window.location.href = `${tasks[0]}.html?entry=${encodeURIComponent(entryCondition)}`;
    }

    function showCompletionScreen() {
      sessionStorage.removeItem("behavioralTaskWorkflow");
      document.body.innerHTML = `
        <main class="completion-screen" role="status" aria-live="polite">
          <div>
            <div>실험이 종료되었습니다.<br>감사합니다.</div>
            <button class="task-button" type="button" id="backToMainBtn">돌아가기</button>
          </div>
        </main>
      `;
      document.getElementById("backToMainBtn").addEventListener("click", () => {
        history.replaceState(null, "", location.pathname);
        window.location.href = "main.html";
      });
    }

    if (new URLSearchParams(location.search).get("completed") === "1") {
      showCompletionScreen();
    } else {
      participantId.value = localStorage.getItem("behavioralTaskParticipantId") || "";
      document.querySelectorAll("[data-entry]").forEach((button) => {
        button.addEventListener("click", () => begin(button.dataset.entry, button.dataset.tasks.split(",")));
      });
      participantId.addEventListener("input", () => { status.textContent = ""; });
    }
  </script>
</body>
</html>
